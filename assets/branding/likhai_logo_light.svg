<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" fill="none">
  <!-- LIGHT MODE LIKH AI LOGO (Warm/off-white background context) -->
  
  <!-- Logo Mark (Dark Navy rounded squircle) -->
  <g transform="translate(6, 8)">
    <rect width="64" height="64" rx="17" fill="#101D2D" />
    
    <!-- Cream/Off-white handwriting 'L' stroke -->
    <path d="M 20 16 L 20 44 Q 20 49 25 49 L 34 49" 
          stroke="#FCFAF6" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- 3 Orange horizontal digitizing strokes -->
    <rect x="36" y="19" width="16" height="5.5" rx="2.75" fill="#DF6729" />
    <rect x="33" y="29.5" width="19" height="5.5" rx="2.75" fill="#DF6729" />
    <rect x="37" y="40" width="15" height="5.5" rx="2.75" fill="#DF6729" />
  </g>
  
  <!-- Wordmark & Tagline -->
  <!-- Dark Navy 'LIKH' -->
  <text x="86" y="44" 
        fill="#101D2D" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="28" 
        letter-spacing="-0.5">LIKH</text>
        
  <!-- Orange 'AI' superscript -->
  <text x="156" y="32" 
        fill="#DF6729" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="14" 
        letter-spacing="0.2">AI</text>
        
  <!-- Tagline: "Your handwriting. Digitized." -->
  <text x="87" y="61" 
        fill="#6B7280" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="500" 
        font-size="11.5" 
        letter-spacing="-0.1">Your handwriting. Digitized.</text>
</svg>
